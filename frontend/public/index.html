<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12161A" />
    <meta
      name="description"
      content="Crystal Meets — discover Irish car meets, trackdays, JDM nights and Cars & Coffee events."
    />

    <title>Crystal Meets — Irish Car Culture Discovery</title>

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Plus Jakarta Sans (body) + Space Grotesk (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet base stylesheet from CDN so tiles/panes/controls render correctly -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Open Graph defaults (per-meet OG tags are served by /api/share/meet/{id} for crawlers) -->
    <meta property="og:site_name" content="Crystal Meets" />
    <meta property="og:title" content="Crystal Meets — Irish Car Culture Discovery" />
    <meta
      property="og:description"
      content="Trackdays at Mondello, Cars & Coffee across the island, JDM nights, rally weekends — all on one map."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent flash-of-wrong-theme: apply the persisted class before React mounts -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cm_theme");
          if (t !== "light") t = "dark";
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("%PUBLIC_URL%/fonts/MontserratRegular-BWBEl.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("%PUBLIC_URL%/fonts/MontserratSemibold-Yz368.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("%PUBLIC_URL%/fonts/MontserratBold-DOWZd.ttf") format("truetype");
        font-weight: 700 900;
        font-display: swap;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #12161a;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      }
      html.light,
      html.light body {
        background: #f1f5f9;
        color: #0f172a;
      }
    </style>
    <style>
      body, button, input, .brand, .eyebrow, .tags, .header-actions button,
      .theme-button, .detail-header, .fact small, .directions a {
        font-family: "Montserrat", "Plus Jakarta Sans", sans-serif !important;
      }
    </style>
  </head>
  <body>
    <noscript>Crystal Meets requires JavaScript to render the interactive map.</noscript>
    <div id="root"></div>
  </body>
</html>
